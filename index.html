<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechLand(Dedicated for the Techfest IITB)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <h1>TechLand(Dedicated for the Techfest IITB)</h1>
      <ul>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="hero">
      <h2>Welcome to My Page</h2>
      <p>Engaging intro text goes here.</p>
      <a href="#contact" class="btn">Get in Touch</a>
    </section>

    <section id="features">
  <h2>Our featured Technology Stack</h2>
  <ul class="tech-stack">
    <li>
      <span>HTML5</span>
    </li>
    <li>
      <span>CSS3</span>
    </li>
    <li>
      <span>JavaScript</span>
    </li>
    <li>
      <span>React</span>
    </li>
    <li>
      <span>Node.js</span>
    </li>
  </ul>
</section>


    <section id="contact">
      <h2>Contact Us</h2>
      <form id="contactForm" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
          <span class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
          <span class="error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
          <span class="error" aria-live="polite"></span>
        </div>

        <button type="submit">Send</button>
        <div id="form-status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; TechLand(Dedicated for the Techfest IITB)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
